<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | HelpSLA</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/cadastro.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="login.html"><span class="brand-mark">H</span><span>Help<span class="brand-light">SLA</span></span></a>
    <p class="eyebrow">NOVO ACESSO</p>
    <h1>Crie sua conta</h1>
    <p class="muted">O cadastro público cria uma conta de solicitante.</p>
    <form id="register-form" class="stack">
      <label for="nome">Nome completo</label><input id="nome" required minlength="3" maxlength="120" autocomplete="name" placeholder="Seu nome">
      <label for="email">E-mail</label><input id="email" type="email" required autocomplete="email" placeholder="voce@empresa.com">
      <label for="senha">Senha</label><input id="senha" type="password" required minlength="8" autocomplete="new-password" placeholder="Pelo menos 8 caracteres">
      <fieldset class="notification-options">
        <legend>Quais avisos você quer receber?</legend>
        <label><input type="checkbox" name="notificacoes" value="CHAMADO_NOVO" checked> Chamados novos</label>
        <label><input type="checkbox" name="notificacoes" value="CHAMADO_ASSUMIDO" checked> Quando um técnico assumir</label>
        <label><input type="checkbox" name="notificacoes" value="STATUS_ALTERADO" checked> Mudanças de status</label>
        <label><input type="checkbox" name="notificacoes" value="NOVA_MENSAGEM" checked> Novas mensagens</label>
        <label><input type="checkbox" name="notificacoes" value="CHAMADO_RESOLVIDO" checked> Chamados resolvidos</label>
      </fieldset>
      <button class="button primary full" type="submit">Criar conta</button>
      <p id="register-message" class="form-message" role="status"></p>
    </form>
    <p class="muted"><a href="login.html">Voltar para o login</a></p>
  </main>
</body>
</html>
