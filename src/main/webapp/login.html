<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | HelpSLA</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="login.html"><span class="brand-mark">H</span><span>Help<span class="brand-light">SLA</span></span></a>
    <p class="eyebrow">CENTRAL DE SERVIÇOS</p>
    <h1>Acesse sua conta</h1>
    <p class="muted">Entre para abrir e acompanhar solicitações de TI.</p>
    <form id="login-form" class="stack">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="voce@empresa.com">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="Sua senha">
      <button class="button primary full" type="submit">Entrar</button>
      <p id="login-message" class="form-message" role="status"></p>
    </form>
    <p class="muted">Ainda não tem conta? <a href="cadastro.html">Cadastre-se como solicitante</a></p>
    <div class="demo-note"><strong>Conta de demonstração</strong><br>admin@helpsla.local, solicitante@helpsla.local ou tecnico@helpsla.local<br>Senha inicial: Demo123!</div>
  </main>
</body>
</html>
